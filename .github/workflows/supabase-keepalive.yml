name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 12 * * 1,3,5"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Configure os secrets SUPABASE_URL e SUPABASE_ANON_KEY no repositorio (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            --retry 3 --retry-delay 10 --max-time 30 \
            "$SUPABASE_URL/rest/v1/portfolio_categories?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Status HTTP: $status"
          if [ -z "$status" ] || [ "$status" = "000" ] || [ "$status" -ge 500 ]; then
            echo "::error::Supabase respondeu $status - possivel instabilidade ou projeto pausado/inacessivel."
            exit 1
          fi
